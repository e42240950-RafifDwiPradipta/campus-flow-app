name: Campus_Flow
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  table_calendar: ^3.1.2
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  http: ^1.6.0
  provider: ^6.1.5
  webview_flutter: ^4.13.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # PENTING: Tambahkan ini agar bisa mengganti ikon
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logo_campus_flow.png
    - assets/logo_splash.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_campus_flow.png"

flutter_native_splash:
  color: "#1B4D5C"
  image: assets/logo_splash.png
  android_gravity: center
  fullscreen: true
